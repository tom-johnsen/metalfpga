name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen (latest release)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          url = "https://api.github.com/repos/doxygen/doxygen/releases/latest"
          data = json.load(urllib.request.urlopen(url))
          tag = data["tag_name"]
          version = tag.replace("Release_", "").replace("_", ".")
          with open("doxygen_tag.txt", "w") as f:
            f.write(tag)
          with open("doxygen_version.txt", "w") as f:
            f.write(version)
          PY
          tag=$(cat doxygen_tag.txt)
          version=$(cat doxygen_version.txt)
          curl -L -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${version}.linux.bin.tar.gz"
          tar -xzf doxygen.tar.gz
          sudo install -m 0755 "doxygen-${version}/bin/doxygen" /usr/local/bin/doxygen
          doxygen -v

      # If your repo has a Doxyfile, this will generate docs.
      # If docs are already generated by another command, replace this step accordingly.
      - name: Build Doxygen docs
        run: doxygen Doxyfile

      # GitHub Pages expects an artifact directory; we publish ./doxygen
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doxygen/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
